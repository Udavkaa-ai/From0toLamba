name: Build Debug APK

on:
  push:
    branches: [ "claude/**", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          # Для lint ключ прокси не нужен — оставляем пустым.
          echo "MOBILE_APP_KEY=" >> local.properties

      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint/
          retention-days: 7

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        env:
          # Ключ допуска к Railway-прокси. OpenRouter-ключ в APK больше НЕ
          # кладём — он живёт на сервере. MOBILE_PROXY_URL необязателен:
          # если секрета нет, build.gradle подставит прод-домен Railway.
          MOBILE_APP_KEY: ${{ secrets.MOBILE_APP_KEY }}
          MOBILE_PROXY_URL: ${{ secrets.MOBILE_PROXY_URL }}
          # Реклама (Yandex). Оба секрета необязательны: без них build.gradle
          # оставит рекламу выключенной (ADS_ENABLED=false) с демо-блоком.
          ADS_ENABLED: ${{ secrets.ADS_ENABLED }}
          YANDEX_REWARDED_UNIT_ID: ${{ secrets.YANDEX_REWARDED_UNIT_ID }}
          YANDEX_BANNER_UNIT_ID: ${{ secrets.YANDEX_BANNER_UNIT_ID }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> local.properties
          # tr -d: убираем случайные \r\n/пробелы из скопированного секрета.
          CLEAN_KEY=$(printf '%s' "$MOBILE_APP_KEY" | tr -d '[:space:]')
          printf 'MOBILE_APP_KEY=%s\n' "$CLEAN_KEY" >> local.properties
          if [ -n "$MOBILE_PROXY_URL" ]; then
            CLEAN_URL=$(printf '%s' "$MOBILE_PROXY_URL" | tr -d '[:space:]')
            printf 'MOBILE_PROXY_URL=%s\n' "$CLEAN_URL" >> local.properties
          fi
          if [ -n "$ADS_ENABLED" ]; then
            CLEAN_ADS=$(printf '%s' "$ADS_ENABLED" | tr -d '[:space:]')
            printf 'ADS_ENABLED=%s\n' "$CLEAN_ADS" >> local.properties
          fi
          if [ -n "$YANDEX_REWARDED_UNIT_ID" ]; then
            CLEAN_UNIT=$(printf '%s' "$YANDEX_REWARDED_UNIT_ID" | tr -d '[:space:]')
            printf 'YANDEX_REWARDED_UNIT_ID=%s\n' "$CLEAN_UNIT" >> local.properties
          fi
          if [ -n "$YANDEX_BANNER_UNIT_ID" ]; then
            CLEAN_BANNER=$(printf '%s' "$YANDEX_BANNER_UNIT_ID" | tr -d '[:space:]')
            printf 'YANDEX_BANNER_UNIT_ID=%s\n' "$CLEAN_BANNER" >> local.properties
          fi
          if [ -z "$CLEAN_KEY" ]; then
            echo "::warning::MOBILE_APP_KEY секрет пуст — AI и фидбек получат 401 от прокси. Добавь секрет в Settings → Secrets → Actions."
          else
            echo "MOBILE_APP_KEY задан (длина ${#CLEAN_KEY})"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 7
